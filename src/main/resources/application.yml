# ─────────────────────────────────────────────────────────────────────────────
# Conveyor — Main Application Configuration
# ─────────────────────────────────────────────────────────────────────────────
# Values marked ${VARIABLE:default} read from environment / .env file first,
# then fall back to the default shown.  Set real secrets in your .env file.
# ─────────────────────────────────────────────────────────────────────────────

spring:

  application:
    name: conveyor-api

  # ── PostgreSQL Database ──────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:conveyor}
    username: ${POSTGRES_USER:conveyor_user}
    password: ${POSTGRES_PASSWORD:conveyor_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Maximum connections in the pool — tune based on Postgres max_connections
      maximum-pool-size: 10
      # Minimum idle connections kept alive
      minimum-idle: 2
      connection-timeout: 30000

  # ── JPA / Hibernate ─────────────────────────────────────────────────────
  jpa:
    hibernate:
      # validate = Hibernate checks schema matches entities, Flyway owns creation
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ── Flyway — Database Migrations ────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ── Redis ────────────────────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # Connection pool for high-throughput
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2

  # ── File Upload Limits ───────────────────────────────────────────────────
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

# ── Actuator (Observability) ─────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: always

# ── JWT Authentication ───────────────────────────────────────────────────────
jwt:
  # Use a strong secret in production (at least 256 bits / 32 chars)
  secret: ${JWT_SECRET:conveyor-super-secret-jwt-key-that-is-long-enough-for-hs256}
  # Token lives for 24 hours (in milliseconds)
  expiration-milliseconds: 86400000

# ── File Storage Paths ───────────────────────────────────────────────────────
storage:
  base-directory: ${STORAGE_BASE_PATH:uploads}
  originals-directory: uploads/originals
  thumbnails-directory: uploads/thumbnails
  compressed-directory: uploads/compressed

# ── Worker Settings ──────────────────────────────────────────────────────────
worker:
  # How many retry attempts before a job is permanently failed
  maximum-retry-attempts: 3
  # Jobs stuck in PROCESSING for longer than this (in minutes) are requeued
  stuck-job-timeout-minutes: 2
  # How often the stuck-job reaper runs (in milliseconds)
  reaper-check-interval-milliseconds: 30000
  # Thumbnail output size (pixels)
  thumbnail-width-pixels: 200
  thumbnail-height-pixels: 200

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    com.conveyor: INFO
    org.springframework.security: WARN

# ── Redis Queue Names (shared constants for API and Worker) ──────────────────
queue:
  job-queue-name: conveyor:job_queue
  dead-letter-queue-name: conveyor:dead_letter_queue
  job-lock-prefix: "conveyor:lock:"
  job-cache-prefix: "conveyor:cache:job:"
  # Cache TTL in seconds
  job-cache-ttl-seconds: 60
  # Redis lock TTL — worker must finish within this time or lock expires
  job-lock-ttl-seconds: 180
